<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REIQ by Shubhendu</title><style>:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--violet:#6d28d9;--line:#e7eaf3}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.shell{height:100%;display:flex;flex-direction:column}.top{height:64px;flex:none;background:#160f35;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 4px 16px #0002;position:relative;z-index:5}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#8b5cf6,#e91e8c);display:grid;place-items:center;font-weight:900;font-size:15px}.name{font-size:16px;font-weight:800}.name small{display:block;font-size:10px;color:#cfc9e6;font-weight:600;letter-spacing:.12em;margin-top:2px}.tag{font-size:11px;font-weight:700;color:#cfc9e6;border:1px solid #ffffff24;border-radius:999px;padding:6px 10px}.bar{height:46px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px;overflow:auto}.tab{border:0;background:transparent;color:var(--muted);font:600 12px inherit;padding:7px 11px;border-radius:8px;white-space:nowrap;cursor:pointer}.tab:hover{background:#f7f5ff}.tab.active{background:#f0eafe;color:var(--violet)}.workspace{position:relative;flex:1;min-height:0;overflow:hidden}.view{position:absolute;inset:0;display:none}.view.active{display:block}.moduleframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}.security{position:absolute;right:14px;top:12px;z-index:4;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;box-shadow:0 4px 16px #0f172a14;font-size:10.5px;color:var(--muted);max-width:300px}.security b{color:#059669}.security button{float:right;border:0;background:none;color:#94a3b8;cursor:pointer;margin-left:8px}@media(max-width:800px){.security{display:none}}</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="mark">RQ</div><div class="name">REIQ <span style="font-weight:600">by Shubhendu</span><small>RETAIL EXPANSION INTELLIGENCE QUOTIENT</small></div></div><div class="tag">V1 · Security-first</div></header><nav class="bar"><button class="tab active" data-view="core" type="button">REIQ Core</button><button class="tab" data-view="satellite" type="button">Satellite Intelligence</button><button class="tab" data-view="growth" type="button">Development &amp; Growth</button><button class="tab" data-view="network" type="button">Network Intelligence</button></nav><main class="workspace"><section id="core" class="view active"><div class="security" id="security"><button type="button" onclick="this.parentElement.remove()">×</button><b>SECURITY:</b> No API key or credential is stored in this REIQ code.</div><iframe id="coreFrame" class="moduleframe" src="../index.html" title="REIQ Core"></iframe></section><section id="satellite" class="view"><iframe id="satelliteFrame" class="moduleframe" title="REIQ Satellite Intelligence"></iframe></section><section id="growth" class="view"><iframe id="growthFrame" class="moduleframe" title="REIQ Development and Growth"></iframe></section><section id="network" class="view"><iframe id="networkFrame" class="moduleframe" title="REIQ Network Intelligence"></iframe></section></main></div><script>const tabs=[...document.querySelectorAll('.tab')],views=[...document.querySelectorAll('.view')];const frames={satellite:document.getElementById('satelliteFrame'),growth:document.getElementById('growthFrame'),network:document.getElementById('networkFrame')};const loaded={satellite:false,growth:false,network:false};const KEY='REIQ_SHARED_LOCATION';function saveCoreLocation(){try{const d=document.getElementById('coreFrame').contentDocument,a=d&&d.getElementById('addr');if(a&&a.value.trim())localStorage.setItem(KEY,JSON.stringify({query:a.value.trim(),ts:Date.now()}))}catch(e){}}function shared(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function prepareModule(name){const f=frames[name];if(!f)return;f.addEventListener('load',()=>{try{const d=f.contentDocument,s=shared(),q=d&&d.getElementById('q');if(q){if(s&&s.query){q.value=s.query;q.style.display='none';const c=q.parentElement;if(c)[...c.querySelectorAll('button')].forEach(b=>b.style.display='none');const st=d.getElementById('status');if(st)st.textContent='Using the location selected in REIQ Core.';const run=d.getElementById('go');if(run)run.click()}else{q.style.display='none';const c=q.parentElement;if(c)[...c.querySelectorAll('button')].forEach(b=>b.style.display='none')}}}catch(e){}} ,{once:true})}function showView(name){saveCoreLocation();tabs.forEach(t=>t.classList.toggle('active',t.dataset.view===name));views.forEach(v=>v.classList.toggle('active',v.id===name));if(frames[name]&&!loaded[name]){prepareModule(name);frames[name].src=name==='satellite'?'satellite.html':name==='growth'?'growth.html':'network.html';loaded[name]=true}}tabs.forEach(t=>t.addEventListener('click',()=>showView(t.dataset.view)));const core=document.getElementById('coreFrame');core.addEventListener('load',()=>{try{const d=core.contentDocument;d.title='REIQ by Shubhendu';const h=d.querySelector('.title h1');if(h)h.textContent='Retail Expansion Intelligence — REIQ';const p=d.querySelector('.title p');if(p)p.textContent='Make smarter expansion decisions with REIQ by Shubhendu';const t=d.getElementById('dbgBuildTag');if(t)t.textContent='Diagnostics — REIQ Core';const a=d.getElementById('addr');if(a){a.addEventListener('input',saveCoreLocation);a.addEventListener('change',saveCoreLocation)}}catch(e){}});setInterval(saveCoreLocation,1500);</script></body></html>
