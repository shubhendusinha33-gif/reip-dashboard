<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REIQ by Shubhendu</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}#app{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="dashboard.html" title="REIQ by Shubhendu"></iframe><script>(function(){const f=document.getElementById('app');function clean(){try{const d=f.contentDocument;if(!d)return;d.querySelectorAll('.module-frame').forEach(x=>{x.style.height='calc(100vh + 20px)';x.style.marginTop='-120px';x.style.display='block'});d.querySelectorAll('.page#satellite .hero,.page#growth .hero,.page#network .hero').forEach(x=>x.style.marginBottom='8px');}catch(e){}}f.addEventListener('load',function(){clean();setTimeout(clean,500);setTimeout(clean,1500)});setInterval(clean,2000)})();</script></body></html>
