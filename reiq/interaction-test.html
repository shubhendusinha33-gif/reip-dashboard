<!doctype html><meta charset="utf-8"><title>REIQ interaction test</title><style>body{font:14px Arial;padding:24px;background:#f5f7fb}button{padding:10px 14px;margin:5px;border:1px solid #ccd5e5;border-radius:7px;background:#fff;cursor:pointer}#out{margin-top:16px;padding:14px;background:#fff;border-radius:8px}</style><h2>REIQ Interaction Test</h2><p>This diagnostic verifies browser click handling independently of the dashboard UI.</p><button id="nav">Navigation click</button><button id="settings">Settings click</button><button id="storage">Local storage</button><div id="out">Ready</div><script>const o=document.getElementById('out');document.getElementById('nav').onclick=()=>o.textContent='Navigation click OK';document.getElementById('settings').onclick=()=>o.textContent='Settings click OK';document.getElementById('storage').onclick=()=>{localStorage.setItem('REIQ_TEST','OK');o.textContent='Local storage OK: '+localStorage.getItem('REIQ_TEST')}</script>
